name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: JsonStringConverter
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release]
        build_platform: [x64, Win32, ARM64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      
    - name: plain cmake VS build
      run: |
           mkdir _build
           cd _build
           cmake -G "Visual Studio 18 2026" -A ${{ matrix.build_platform }} -T "v145" ..
           cmake --build . --config ${{ matrix.build_configuration }}

    - name: Archive artifacts for ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
          name: ${{ env.Projectname }}-${{ matrix.build_platform }}.zip
          path: ./_build/${{ matrix.build_configuration }}/${{ env.Projectname }}.dll

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: ${{ env.Projectname }}-${{ matrix.build_platform }}.zip